name: Build release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the reviewed browser test runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run aggregate acceptance before packaging the tag
        run: pnpm verify:acceptance
      - name: Upload developer extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-cortex-untrusted-candidate
          path: |
            release/*.zip
            release/*.sha256
            release/sbom.cdx.json
            release/compatibility.json
            release/build-provenance.json
          if-no-files-found: error
